  if(sec==='departements'||sec==='fonctions')return wTitle(p,'Jeunes','Prépare les listes utilisées dans le formulaire d\'enregistrement.')+segs+`<div class="muted mb">${sec==='departements'?'Saisis les départements de l\'église. Ils apparaissent dans la liste déroulante « Département » quand on enregistre un jeune.':'Saisis les fonctions dans la jeunesse. Elles apparaissent dans la liste déroulante « Fonction » quand on enregistre un jeune.'}</div>`+(sec==='departements'?listCard(p,'departements','Départements de l\'église','building-2','Ex. Chorale, Accueil, Intercession…'):listCard(p,'fonctions','Fonctions dans la jeunesse','badge-check','Ex. Responsable chorale…'));
  return wTitle(p,'Registre des jeunes',`${act.length} jeunes enregistrés${g?'':' · lecture seule'}`,actions)+segs+
  `<div class="kpis"><div class="kpi"><div class="l">Jeunes actifs</div><div class="v">${act.length}</div></div><div class="kpi"><div class="l">Baptisés</div><div class="v">${act.filter(m=>m.baptise).length}</div><div class="s">${act.length?Math.round(act.filter(m=>m.baptise).length/act.length*100):0} %</div></div>${p.mode==='web'?`<div class="kpi"><div class="l">Avec un accès</div><div class="v">${act.filter(m=>acctOfMember(m.id)).length}</div></div><div class="kpi"><div class="l">Bureau</div><div class="v">${DB.accounts.filter(a=>a.roleId!=='membre'&&a.actif).length}</div></div>`:''}</div>
  <div class="card mb"><h3><i data-lucide="building-2" class="i"></i>Par département</h3><div class="pills">${Object.entries(byD).sort((a,b)=>b[1]-a[1]).map(([d,n])=>`<button class="pill ${f.md===d?'on':''}" data-act="setF" data-k="md" data-v="${f.md===d?'all':esc(d)}">${esc(d)}<span class="n" style="background:#eef1ef;border-radius:99px;padding:0 6px;margin-left:5px;font-size:11px">${n}</span></button>`).join('')}</div></div>
  <div class="filters">
    <select class="inp" data-fk="md"><option value="all">Tous les départements</option>${DB.settings.departements.map(d=>`<option ${f.md===d?'selected':''}>${esc(d)}</option>`).join('')}</select>
    <select class="inp" data-fk="mb"><option value="all">Baptisés et non baptisés</option><option value="oui" ${f.mb==='oui'?'selected':''}>Baptisés</option><option value="non" ${f.mb==='non'?'selected':''}>Non baptisés</option></select>
    <select class="inp" data-fk="mr"><option value="all">Tous les accès</option><option value="bureau" ${f.mr==='bureau'?'selected':''}>Membres du bureau</option><option value="membre" ${f.mr==='membre'?'selected':''}>Accès membre</option><option value="aucun" ${f.mr==='aucun'?'selected':''}>Sans accès</option><option value="bloque" ${f.mr==='bloque'?'selected':''}>Comptes bloqués</option></select>
    <select class="inp" data-fk="ma"><option value="actif">Actifs</option><option value="inactif" ${f.ma==='inactif'?'selected':''}>Inactifs</option><option value="tous" ${f.ma==='tous'?'selected':''}>Actifs et inactifs</option></select></div>
  <div class="search mb"><i data-lucide="search" class="i"></i><input class="inp" placeholder="Nom, téléphone, profession, quartier…" data-fk="mq" data-live="1" value="${esc(f.mq||'')}"></div>
  <div class="count-line">${L.length} jeune${L.length>1?'s':''} affiché${L.length>1?'s':''}</div>

    ${L.map(m=>`<tr style="cursor:pointer" data-act="openMember" data-id="${m.id}"><td><div class="row"><div class="avatar sm" style="${m.actif?'':'background:#bbb'}">${initials(m.nom)}</div><div><div class="name">${esc(fullName(m))}</div><div class="muted">${esc(m.fonction)}</div></div></div></td><td>${esc(m.tel)||'<span class="muted">—</span>'}</td><td>${fanniv(m.anniv)||'<span class="muted">—</span>'}</td><td>${m.departement?`<span class="chip mut">${esc(m.departement)}</span>`:'<span class="muted">—</span>'}</td><td>${m.baptise?'<span class="chip ok">Oui</span>':'<span class="chip mut">Non</span>'}</td><td>${esc(m.profession)}</td><td>${roleChip(acctOfMember(m.id))}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Aucun jeune ne correspond.</td></tr>'}
  </tbody></table></div>`
  :`<div class="card" style="padding:4px 14px">${L.map(m=>`<div class="list-item" data-act="openMember" data-id="${m.id}" style="cursor:pointer"><div class="avatar sm" style="${m.actif?'':'background:#bbb'}">${initials(m.nom)}</div><div class="grow"><div class="name ellip">${esc(fullName(m))}</div><div class="muted ellip">${esc(m.departement||'')}${m.anniv?' · 🎂 '+fanniv(m.anniv):''}</div></div>${acctOfMember(m.id)&&acctOfMember(m.id).roleId!=='membre'?roleChip(acctOfMember(m.id)):''}<i data-lucide="chevron-right" class="i" style="color:var(--ink-3)"></i></div>`).join('')||'<div class="empty">Aucun jeune ne correspond.</div>'}</div>`}`;
}
function statutLabel(a,m){if(m&&!m.actif)return'<span class="chip mut">Inactif</span>';if(a&&!a.actif)return'<span class="chip late">Bloqué</span>';const r=a&&role(a.roleId);return r&&r.id!=='membre'?`<span class="chip gold">${esc(r.id==='president'?'Président':r.nom)}</span> <span class="chip mut">Membre</span>`:'<span class="chip mut">Membre</span>'}

  const cot=`<div class="card"><h3><i data-lucide="wallet" class="i"></i>Cotisations</h3>${cs.map(c=>{const s=situation(c.id,mid);return `<div class="list-item" data-act="opencamp" data-id="${c.id}" style="cursor:pointer"><div class="grow"><div class="name">${esc(c.nom)}</div><div class="muted">${fmtN(s.verse)} / ${fmtN(s.total)} · reste ${fmtN(s.reste)}</div></div>${statutChip(s.statut)}</div>`}).join('')||'<div class="empty">Aucune campagne.</div>'}</div>`;

/* ---- Journal / Paramètres / Plus / Profil ---- */
function vJournal(p,limit){
  const f=p.f;let j=DB.journal.slice().reverse();
  const types=[['all','Tout'],['paiement','Paiements'],['campagne','Campagnes'],['membre','Jeunes'],['acces','Accès'],['relance','Relances']];

let liveT;
document.addEventListener('input',e=>{
  const t=e.target;const paneId=t.closest('[data-pane]')?.dataset.pane;const p=pane(paneId);

  if(t.dataset.actInput==='ncRecalc'&&p)ncRecalc(p);
  if(t.id==='pay-amt')updPrev();
  if(t.dataset.payf==='montant'&&p){const el=document.getElementById('tprev-'+p.id);if(el&&p.pay.cid&&p.pay.mid)el.innerHTML=previewHtml(situation(+p.pay.cid,+p.pay.mid),+digits(p.pay.montant))}
  if(t.dataset.fk&&t.dataset.live&&p){p.f[t.dataset.fk]=t.value;if(t.dataset.fk==='rtpl')return;clearTimeout(liveT);liveT=setTimeout(()=>{const pos=t.selectionStart;rerender(p);const n=document.querySelector(`#pane-${p.id} [data-fk="${t.dataset.fk}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}},250)}
});
document.addEventListener('change',e=>{
  const t=e.target;const paneId=t.closest('[data-pane]')?.dataset.pane;const p=pane(paneId);
  if(t.dataset.payf&&p&&(t.dataset.payf==='mid'||t.dataset.payf==='cid')){p.pay[t.dataset.payf]=t.value;if(t.dataset.payf==='cid')p.pay.mid='';rerender(p)}
  if(t.dataset.fk&&!t.dataset.live&&p){p.f[t.dataset.fk]=t.value;rerender(p)}
  if(t.dataset.fk==='rtpl'&&p)rerender(p);
  if(t.dataset.import)handleImport(t,p);
  if(t.classList.contains('nc-chk')&&p)ncRecalc(p);
  if(t.id==='pay-camp'){const pp=pane(MCTX&&MCTX.pane);if(pp)openPay(pp,+t.value,'mm')}
  if(t.id==='r-m'){const a=acctOfMember(+t.value);if(a)document.querySelectorAll('#r-roles .pill').forEach(b=>b.classList.toggle('on',b.dataset.v===a.roleId));roleDesc()}
});

function ncRecalc(p){
  const root=document.getElementById('pane-'+p.id);if(!root)return;
  const deb=root.querySelector(`#nc-deb-${p.id}`)?.value,fin=root.querySelector(`#nc-fin-${p.id}`)?.value;const pb=root.querySelector(`#nc-per-${p.id}`);
  if(pb&&!pb.dataset.manuel){const a=perAuto(deb,fin);pb.querySelectorAll('.pill').forEach(b=>b.classList.toggle('on',b.dataset.v===a))}
  const per=root.querySelector(`#nc-per-${p.id} .pill.on`)?.dataset.v||'mois';
  const n0=nPeriodes(deb,fin,per),n=Math.max(1,n0);const u={jour:'jour',semaine:'sem.',mois:'mois',unique:'en une fois'}[per];let tot=0,cnt=0;
  const box=root.querySelector(`#nc-dur-${p.id}`);if(box){box.className='info mb'+(n0?'':' red');box.innerHTML=n0?`Du <b>${fdate(deb)}</b> au <b>${fdate(fin)}</b> → <b>${nbPer({periode:per},n0)}</b>${per==='unique'?` à verser au plus tard le ${fdate(fin)}`:` (une échéance chaque ${PER[per][0]})`}.${n0>{jour:120,semaine:104,mois:36,unique:1}[per]?' <b>Trop d\'échéances : choisis un autre rythme.</b>':''}`:'La date de fin doit être après la date de début.'}
  root.querySelectorAll('.nc-amt').forEach(i=>{const v=+digits(i.value);const chk=root.querySelector(`.nc-chk[data-m="${i.dataset.m}"]`).checked;const prev=root.querySelector(`.nc-prev[data-m="${i.dataset.m}"]`);
    prev.textContent=v&&chk?(per==='unique'?fmtN(v)+' '+u:fmtN(schedule(v,n)[0])+'/'+u):'';if(chk&&v){tot+=v;cnt++}});
  const t=root.querySelector(`#nc-tot-${p.id}`);if(t)t.textContent=`${fmt(tot)} · ${cnt} membres`;
}
function readCampForm(p){
  const root=document.getElementById('pane-'+p.id);const nom=root.querySelector(`#nc-nom-${p.id}`).value.trim();
  const deb=root.querySelector(`#nc-deb-${p.id}`).value,fin=root.querySelector(`#nc-fin-${p.id}`).value,per=root.querySelector(`#nc-per-${p.id} .pill.on`)?.dataset.v||'mois';const n=nPeriodes(deb,fin,per);
  if(!nom){toast('Donne un nom à la campagne.');return null}if(!deb||!fin){toast('Choisis la date de début et la date de fin.');return null}if(!n){toast('La date de fin doit être après la date de début.');return null}
  if(n>{jour:120,semaine:104,mois:36,unique:1}[per]){toast('Trop d\'échéances pour ce rythme : choisis-en un autre.');return null}
  const lignes=[];let bad=null;root.querySelectorAll('.nc-amt').forEach(i=>{const chk=root.querySelector(`.nc-chk[data-m="${i.dataset.m}"]`).checked;const v=+digits(i.value);if(chk&&v)lignes.push({memberId:+i.dataset.m,montant:v});else if(chk&&!v)bad=bad||member(+i.dataset.m)});
  if(bad){toast(`Montant manquant pour ${fullName(bad)} (ou décoche-le).`);return null}
  if(!lignes.length){toast('Indique au moins un montant.');return null}
  return{nom,n,deb,fin,per,lignes};
}

function ncSave(p,cid){
  const c=camp(cid);const r=readCampForm(p);if(!r)return;
  const ch=[];if(r.nom!==c.nom)ch.push(`nom : « ${c.nom} » → « ${r.nom} »`);if(r.deb!==(c.debutJ||c.debut+'-01')||r.fin!==campFin(c)||r.per!==(c.periode||'mois'))ch.push(`dates : ${fdate(c.debutJ||c.debut+'-01')} → ${fdate(campFin(c))} devient ${fdate(r.deb)} → ${fdate(r.fin)} (${nbPer({periode:r.per},r.n)})`);
  const oldMap=new Map(c.lignes.map(l=>[l.memberId,l.montant]));const newMap=new Map(r.lignes.map(l=>[l.memberId,l.montant]));
  const added=r.lignes.filter(l=>!oldMap.has(l.memberId)),removed=c.lignes.filter(l=>!newMap.has(l.memberId)),changed=r.lignes.filter(l=>oldMap.has(l.memberId)&&oldMap.get(l.memberId)!==l.montant);

  if(!ch.length){toast('Aucune modification.');return}
  PENDING={pane:p.id,cid,...r,ch,changed,oldMap};MCTX={pane:p.id};
  const oldT=campTotal(c),newT=r.lignes.reduce((a,l)=>a+l.montant,0);
  openModal(`<h2>Enregistrer les modifications ?</h2><div class="receipt mt">${ch.map(x=>`<div class="rl"><span>${esc(x)}</span></div>`).join('')}
  ${changed.slice(0,8).map(l=>`<div class="rl"><span class="muted">${esc(fullName(member(l.memberId)))}</span><b>${fmtN(oldMap.get(l.memberId))} → ${fmtN(l.montant)}</b></div>`).join('')}${changed.length>8?`<div class="rl"><span class="muted">… et ${changed.length-8} autres</span></div>`:''}
  <div class="rl"><span>Total attendu</span><b>${fmt(oldT)} → ${fmt(newT)}</b></div></div>
  <div class="info mt">Les membres concernés verront leur nouvel échéancier tout de suite. Le changement est inscrit au journal.</div>
  <div class="foot"><button class="btn sec" data-act="closeModal">Retour</button><button class="btn" data-act="confirmSave">Enregistrer</button></div>`);

let DL=null;
async function getDL(){if(DL!==null)return DL;try{DL=await window.claude?.use?.('downloads')||false}catch(e){DL=false}return DL}
async function saveXlsx(filename,sheets){
  if(typeof XLSX==='undefined'){toast('Module Excel non chargé.');return}
  const wb=XLSX.utils.book_new();
  sheets.forEach(([name,rows,widths])=>{const ws=XLSX.utils.aoa_to_sheet(rows);if(widths)ws['!cols']=widths.map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31))});
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  const dl=await getDL();
  if(!dl){toast('Téléchargement indisponible dans cette vue (il fonctionnera dans l\'application).');return}
  try{await dl.save({filename,data:new Blob([buf])});toast('Fichier Excel prêt : '+filename)}catch(err){if(err&&err.code==='declined')return;toast('Téléchargement refusé ou indisponible.')}
}

let IMPORT=null;
function handleImport(input,p){
  const f=input.files[0];if(!f)return;input.value='';
  if(typeof XLSX==='undefined'){toast('Module Excel non chargé.');return}
  const r=new FileReader();r.onload=ev=>{
    try{
      const wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellDates:true});
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
      const h=rows.findIndex(r=>r.some(c=>/nom/i.test(String(c))));if(h<0){toast('Colonne « Nom » introuvable.');return}
      const H=rows[h].map(c=>String(c));const col=re=>H.findIndex(c=>re.test(c));
      const cN=col(/^nom|nom\s*&|nom et/i)>=0?col(/^nom|nom\s*&|nom et/i):col(/nom/i),cP=col(/pr[ée]nom/i)!==cN?col(/pr[ée]nom/i):-1;
      const cT=col(/contact|t[ée]l|num[ée]ro/i),cE=col(/mail/i),cB=col(/naiss|anniv/i),cBa=col(/bapt/i),cPr=col(/profession|m[ée]tier/i),cH=col(/habit|lieu|quartier|commune/i),cD=col(/d[ée]part/i),cF=col(/fonction|poste/i);
      const dt=v=>{if(v instanceof Date)return String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');const s=String(v).trim();let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})/);if(m)return `${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;m=s.match(/^\d{4}-(\d{2})-(\d{2})$/);return m?`${m[1]}-${m[2]}`:''};
      const out=[];
      for(const r of rows.slice(h+1)){let n=String(r[cN]||'').trim();if(!n||/^(total|l[ée]gende|cellules|solde|mois)/i.test(n)||n.length>70)continue;
        const [nn,ff]=splitFonction(n);const fct0=cF>=0&&String(r[cF]).trim()?String(r[cF]).trim():ff;const fct=DB.settings.fonctions.find(x=>norm(x)===norm(fct0))||fct0;
        const o={nom:nn.toUpperCase(),prenoms:cP>=0?String(r[cP]).trim().toUpperCase():'',tel:cT>=0?String(r[cT]).trim():'',email:cE>=0?String(r[cE]).trim().toLowerCase():'',anniv:cB>=0?dt(r[cB]):'',
          baptise:cBa>=0?/^o|^y|1|vrai/i.test(String(r[cBa]).trim()):false,profession:cPr>=0?String(r[cPr]).trim():'',habitation:cH>=0?String(r[cH]).trim():'',
          departement:cD>=0?matchDep(String(r[cD]).trim()):'',fonction:fct||'Membre',adhesion:today()};
        const dup=DB.members.find(m=>norm(fullName(m))===norm(o.nom+o.prenoms)||(o.tel&&digits(m.tel)===digits(o.tel))||(o.email&&m.email===o.email))||out.find(x=>norm(x.nom+x.prenoms)===norm(o.nom+o.prenoms));
        o.dup=dup?fullName(dup):null;out.push(o)}
      if(!out.length){toast('Aucune ligne trouvée dans le fichier.');return}
      IMPORT={pane:p.id,rows:out,file:f.name};MCTX={pane:p.id};
      const nNew=out.filter(o=>!o.dup).length;
      openModal(`<h2>Importer « ${esc(f.name)} »</h2><div class="muted mb">${out.length} lignes lues · <b style="color:var(--green)">${nNew} nouveaux</b> · ${out.length-nNew} déjà présents (décochés)</div>
      <div class="tbl-wrap" style="max-height:50vh;overflow:auto"><table class="t"><thead><tr><th></th><th>Nom &amp; prénoms</th><th>Téléphone</th><th>Département</th><th></th></tr></thead><tbody>
      ${out.map((o,i)=>`<tr><td><input type="checkbox" class="imp-chk" data-i="${i}" ${o.dup?'':'checked'}></td><td class="name">${esc((o.nom+' '+o.prenoms).trim())}</td><td>${esc(o.tel)||'—'}</td><td>${esc(o.departement)||'—'}</td><td>${o.dup?`<span class="chip part">Déjà présent</span>`:'<span class="chip ok">Nouveau</span>'}</td></tr>`).join('')}
      </tbody></table></div>
      <label class="row mt" style="gap:8px;font-weight:600"><input type="checkbox" id="imp-acc" checked> Créer aussi leurs accès membres (si téléphone ou e-mail)</label>
      <div class="foot"><button class="btn sec" data-act="closeModal">Annuler</button><button class="btn" data-act="confirmImport"><i data-lucide="upload" class="i"></i>Importer la sélection</button></div>`,null,true);
    }catch(err){toast('Fichier illisible : '+err.message)}
  };r.readAsArrayBuffer(f);
}
function confirmImport(){
  if(!IMPORT)return;const sel=[...document.querySelectorAll('.imp-chk')].filter(c=>c.checked).map(c=>IMPORT.rows[+c.dataset.i]);const acc=document.getElementById('imp-acc').checked;let na=0;
  sel.forEach(o=>{const{dup,...data}=o;const m={id:DB.seq++,...data,actif:true,creeLe:nowIso()};DB.members.push(m);if(acc&&(m.tel||m.email)){DB.accounts.push({id:DB.seq++,memberId:m.id,roleId:'membre',pwd:genPwd(),actif:true,mustChange:true,creeLe:nowIso(),derniere:null});na++}});
  log(who(),'Import Excel',`${sel.length} jeunes ajoutés depuis « ${IMPORT.file} »${na?`, ${na} accès créés`:''}`);
  IMPORT=null;closeModal();toast(`${sel.length} jeunes ajoutés${na?`, ${na} accès créés`:''}.`);refresh();
}

const CATS=['Culte','Réunion','Sortie','Formation','Action sociale','Célébration','Autre'];
const CATIC={'Culte':'church','Réunion':'users-round','Sortie':'bus','Formation':'graduation-cap','Action sociale':'heart-handshake','Célébration':'party-popper','Autre':'calendar'};
const CATCOL={'Culte':'#17603f','Réunion':'#2f6fd6','Sortie':'#0e8a7a','Formation':'#7a4fc9','Action sociale':'#c2410c','Célébration':'#b37509','Autre':'#4a5852'};
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
function dISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addD(n){const d=new Date();d.setDate(d.getDate()+n);return dISO(d)}
function evD(e){return new Date(e.debut.slice(0,10)+'T12:00')}
function evHeure(e){return e.debut.slice(11,16).replace(':','h')+(e.fin?' – '+e.fin.slice(11,16).replace(':','h'):'')}
function evDateLong(e){const d=evD(e);const j=JOURS[d.getDay()];return `${j[0].toUpperCase()+j.slice(1)} ${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}`}
function evPast(e){return (e.fin||e.debut).slice(0,10)<today()}
function evDays(e){const n=new Date(today()+'T12:00');return Math.round((evD(e)-n)/864e5)}
function evDans(e){const n=evDays(e);return n===0?'Aujourd\'hui':n===1?'Demain':n>1?`Dans ${n} jours`:`Il y a ${-n} jour${n<-1?'s':''}`}
function evt(id){return DB.events.find(e=>e.id===id)}
function upcoming(){return DB.events.filter(e=>!e.annule&&!evPast(e)).sort((a,b)=>a.debut.localeCompare(b.debut))}
function rep(eid,mid){return DB.evtRep.find(r=>r.evtId===eid&&r.mid===mid)}
function evCounts(e){const R=DB.evtRep.filter(r=>r.evtId===e.id&&member(r.mid)?.actif);return{oui:R.filter(r=>r.reponse==='oui').length,pe:R.filter(r=>r.reponse==='peut_etre').length,non:R.filter(r=>r.reponse==='non').length,pres:R.filter(r=>r.present).length}}
function evTasks(e){return DB.tasks.filter(t=>t.evtId===e.id)}
function dbadge(e,big){const d=evD(e);return `<div class="dbadge ${big?'big':''}" style="--c:${CATCOL[e.categorie]||'#17603f'}"><b>${d.getDate()}</b><span>${MCOURT[d.getMonth()]}</span></div>`}
const REPL={oui:['Je participe','ok','check'],peut_etre:['Peut-être','part','help-circle'],non:['Absent','mut','x']};
function evRow(e,p){const me=sMember(p),r=rep(e.id,me.id),c=evCounts(e),g=can(p,'evenements_gerer');
  return `<div class="list-item" style="cursor:pointer;${e.annule?'opacity:.6':''}" data-act="openEvt" data-id="${e.id}">${dbadge(e)}<div class="grow" style="min-width:0"><div class="name ellip">${esc(e.titre)}</div><div class="muted ellip">${e.annule?'<b style="color:var(--red)">Annulé</b> · ':''}${evHeure(e)}${e.lieu?' · '+esc(e.lieu):''}</div>
  ${g&&!e.annule?`<div class="muted" style="font-size:11.5px">${c.oui} participent · ${c.pe} peut-être${evTasks(e).length?` · tâches ${evTasks(e).filter(t=>t.faite).length}/${evTasks(e).length}`:''}</div>`:''}</div>
  ${!g&&r&&r.reponse&&!e.annule?`<span class="chip ${REPL[r.reponse][1]}">${REPL[r.reponse][0]}</span>`:'<i data-lucide="chevron-right" class="i" style="color:var(--ink-3)"></i>'}</div>`}
function eventsBlock(p,n=3){const L=upcoming();const g=can(p,'evenements_gerer');

  <div class="card mb"><div class="kv"><span><i data-lucide="calendar" class="i i-sm"></i> Date</span><b>${evDateLong(e)}</b></div><div class="kv"><span><i data-lucide="clock" class="i i-sm"></i> Heure</span><b>${evHeure(e)}</b></div>${e.lieu?`<div class="kv"><span><i data-lucide="map-pin" class="i i-sm"></i> Lieu</span><b>${esc(e.lieu)}</b></div>`:''}${resp?`<div class="kv"><span><i data-lucide="user-round-cog" class="i i-sm"></i> Organisé par</span><b>${esc(titleCase(fullName(resp)))}</b></div>`:''}
  ${e.description?`<div style="margin-top:10px;line-height:1.55;color:var(--ink-2)">${esc(e.description).replace(/\n/g,'<br>')}</div>`:''}</div>`;
  if(myTasks.length)h+=`<div class="info gold mb"><b>Ta mission pour cet événement :</b><br>${myTasks.map(t=>`${t.faite?'✅':'•'} ${esc(t.libelle)}`).join('<br>')}</div>`;
  if(e.inscription&&!e.annule&&!past)h+=`<div class="card mb"><h3><i data-lucide="hand" class="i"></i>Ta réponse</h3><div class="rep3">${Object.entries(REPL).map(([k,[l,,ic]])=>`<button class="${r&&r.reponse===k?'on '+k:''}" data-act="evRep" data-id="${e.id}" data-v="${k}"><i data-lucide="${ic}" class="i i-sm"></i>${l}</button>`).join('')}</div>
    <div class="muted mt" style="text-align:center">${c.oui} participent · ${c.pe} peut-être</div></div>`;
  h+=`<div class="row mb" style="gap:8px"><a class="btn ch-wa sm" style="flex:1" href="https://wa.me/?text=${share}" target="_blank" rel="noopener"><i data-lucide="message-circle" class="i i-sm"></i>Partager sur WhatsApp</a></div>`;
  if(g)h+=evManage(p,e);
  return h}

function evManage(p,e){const past=evPast(e);const c=evCounts(e);const f=p.f.epf||'oui';
  const act=DB.members.filter(m=>m.actif);const st=m=>{const r=rep(e.id,m.id);return r&&r.reponse?r.reponse:'aucune'};
  const L=act.filter(m=>f==='tous'||st(m)===f);const T=evTasks(e);
  const ppl=act.filter(m=>acctOfMember(m.id));
  return `<div class="sect-t"><i data-lucide="settings-2" class="i i-sm"></i>Organisation</div>
  ${e.annule?'':`<div class="grid2 mb"><button class="btn sec" data-act="editEvt" data-id="${e.id}"><i data-lucide="pencil" class="i i-sm"></i>Modifier</button><button class="btn sec" data-act="evRemind" data-id="${e.id}"><i data-lucide="bell-ring" class="i i-sm"></i>Rappel</button></div>`}
  <div class="kpis mb" style="grid-template-columns:repeat(${past?4:3},1fr)"><div class="kpi"><div class="l">Participent</div><div class="v" style="color:var(--green)">${c.oui}</div></div><div class="kpi"><div class="l">Peut-être</div><div class="v" style="color:var(--amber)">${c.pe}</div></div><div class="kpi"><div class="l">Absents</div><div class="v">${c.non}</div></div>${past?`<div class="kpi"><div class="l">Présents</div><div class="v">${c.pres}</div></div>`:''}</div>
  <div class="card mb"><h3><i data-lucide="list-checks" class="i"></i>Tâches<span class="r">${T.filter(t=>t.faite).length}/${T.length}</span></h3>
    ${T.map(t=>{const m=member(t.resp);return `<div class="list-item"><button class="chk ${t.faite?'on':''}" data-act="evTask" data-id="${t.id}"><i data-lucide="check" class="i i-sm"></i></button><div class="grow" style="min-width:0"><div class="name" style="font-size:13px;${t.faite?'text-decoration:line-through;color:var(--ink-3)':''}">${esc(t.libelle)}</div><div class="muted">${m?esc(titleCase(fullName(m))):'Personne désignée'}${t.echeance?' · avant le '+fdate(t.echeance):''}</div></div>${m&&!t.faite&&m.tel?`<a class="btn ch-wa sm" href="https://wa.me/225${digits(m.tel)}?text=${encodeURIComponent(`Bonjour ${prenomOf(m)}, petit rappel pour « ${e.titre} » : ${t.libelle}. Merci !`)}" target="_blank" rel="noopener" title="Rappeler par WhatsApp"><i data-lucide="message-circle" class="i i-sm"></i></a>`:''}<button class="link" style="color:var(--ink-3)" data-act="evTaskDel" data-id="${t.id}" title="Supprimer"><i data-lucide="trash-2" class="i i-sm"></i></button></div>`}).join('')||'<div class="muted" style="padding:6px 0 10px">Aucune tâche. Ajoute ce qu\'il faut préparer et confie chaque tâche à quelqu\'un.</div>'}
    <div class="task-add"><input class="inp" id="tk-l-${p.id}" placeholder="Nouvelle tâche (ex. Réserver la salle)"><select class="inp" id="tk-r-${p.id}"><option value="">Confier à…</option>${act.map(m=>`<option value="${m.id}">${esc(titleCase(fullName(m)))}</option>`).join('')}</select><button class="btn sm" data-act="evTaskAdd" data-id="${e.id}"><i data-lucide="plus" class="i i-sm"></i>Ajouter</button></div></div>
  <div class="card mb"><h3><i data-lucide="users" class="i"></i>${past?'Présences':'Participants'}</h3>
    <div class="pills filters mb">${pills(p,'epf',[['oui','Participent',c.oui],['peut_etre','Peut-être',c.pe],['non','Absents',c.non],['aucune','Sans réponse',act.filter(m=>st(m)==='aucune').length],['tous','Tous',act.length]],'oui')}</div>
    ${past||evDays(e)<=0?'<div class="muted mb">Coche les jeunes présents le jour J.</div>':''}
    ${L.map(m=>{const r=rep(e.id,m.id);return `<div class="list-item"><div class="avatar sm">${initials(m.nom)}</div><div class="grow" style="min-width:0"><div class="name ellip">${esc(titleCase(fullName(m)))}</div><div class="muted">${r&&r.reponse?REPL[r.reponse][0]:'Pas encore répondu'}</div></div>
      ${past||evDays(e)<=0?`<button class="chk ${r&&r.present?'on':''}" data-act="evPres" data-id="${e.id}" data-m="${m.id}" title="Présent"><i data-lucide="check" class="i i-sm"></i></button>`:chans(m,`Bonjour ${prenomOf(m)} ! Tu es invité(e) : « ${e.titre} », ${evDateLong(e)} à ${evHeure(e)}${e.lieu?', '+e.lieu:''}. Réponds dans l'appli Younity 🙏`,{labels:false})}</div>`}).join('')||'<div class="empty" style="padding:12px">Personne dans cette liste.</div>'}</div>
  ${e.annule||past?'':`<button class="btn danger block mb" data-act="evCancel" data-id="${e.id}" style="color:#fff"><i data-lucide="calendar-x" class="i i-sm"></i>Annuler l'événement</button>`}`}

function imgField(key,p,cur,hint){return `<div class="field"><label>Visuel ${hint||''}</label><div class="dim-hint"><i data-lucide="ruler" class="i i-sm"></i><span><b>Dimensions : ${BAN_W} × ${BAN_H} px</b> (format bannière 12:5) · JPG ou PNG · 5 Mo max.<br>Garde le texte important au centre, loin des bords.</span></div><label class="img-drop"><input type="file" accept="image/*" data-img="${key}" hidden><img id="prev-${key}-${p.id}" src="${cur||''}" style="${cur?'':'display:none'}"><span ${cur?'style="display:none"':''} id="ph-${key}-${p.id}"><i data-lucide="image-plus" class="i"></i>Choisir une image (${BAN_W} × ${BAN_H})</span></label><div id="warn-${key}-${p.id}" class="info gold mt" style="display:none;font-size:12px"></div></div>`}

  <div class="field"><label>Description</label><textarea class="inp" rows="4" id="ev-desc-${p.id}" placeholder="Programme, ce qu'il faut apporter…">${esc(e?e.description:'')}</textarea></div>

  ${imgField('evImg',p,p.f.evImg,'de l\'événement (facultatif)')}
  <div class="row" style="gap:8px;justify-content:flex-end"><button class="btn sec" data-act="back">Annuler</button><button class="btn" data-act="saveEvt" data-id="${id||''}"><i data-lucide="check" class="i i-sm"></i>${id?'Enregistrer':'Publier l\'événement'}</button></div></div>`}

function vAffiches(p){const L=DB.affiches.slice().sort((a,b)=>a.ordre-b.ordre);
  return wTitle(p,'Bannières de l\'accueil','Les bannières en ligne défilent sur l\'accueil des membres.','<button class="btn" data-act="newAff"><i data-lucide="image-plus" class="i"></i>Nouvelle bannière</button>')+

    <div class="row between mt"><div style="min-width:0"><div class="name ellip">${esc(a.titre)||'Sans titre'}</div><div class="muted">${a.fin?`Du ${fdate(a.debut)} au ${fdate(a.fin)}`:`Depuis le ${fdate(a.debut)}`}${e?' · ouvre « '+esc(e.titre)+' »':a.lien?' · lien':''}</div></div><span class="chip ${k}">${s}</span></div>

function vAffForm(p,id){const a=id?DB.affiches.find(x=>x.id===id):null;p.f.affImg=p.f.affImg===undefined?(a&&a.img)||'':p.f.affImg;

  <div class="field"><label>Quand on touche la bannière</label><select class="inp" id="af-e-${p.id}"><option value="">Afficher l'image en grand</option>${upcoming().map(e=>`<option value="${e.id}" ${a&&a.evtId===e.id?'selected':''}>Ouvrir l'événement « ${esc(e.titre)} »</option>`).join('')}</select></div>
  <div class="field"><label>Ou un lien (facultatif : formulaire, direct, page…)</label><input class="inp" id="af-l-${p.id}" value="${esc(a?a.lien:'')}" placeholder="https://…"></div>
  <div class="grid2"><div class="field"><label>Afficher à partir du</label><input class="inp" type="date" id="af-d-${p.id}" value="${a?a.debut:today()}"></div><div class="field"><label>Jusqu'au (vide = sans fin)</label><input class="inp" type="date" id="af-f-${p.id}" value="${a?a.fin:''}"></div></div>

function vOrgHome(p){const me=sMember(p);const U=upcoming();
  let h=(p.mode==='web'?wTitle(p,`Bonjour ${esc(prenomOf(me))} 👋`,`Organisateur · ${U.length} événement${U.length>1?'s':''} à venir`):`<div class="muted mb" style="font-size:13px">Bonjour <b style="color:var(--ink)">${esc(prenomOf(me))}</b> 👋 · ${U.length} événement${U.length>1?'s':''} à venir</div>`);
  if(U.length)h+=`<div class="row between" style="margin:2px 2px 8px"><div class="name" style="font-size:14px">Prochains événements</div><button class="link" data-act="tab" data-tab="evenements">Tous (${U.length}) →</button></div>
    <div class="bans mb">${U.slice(0,Math.max(3,Math.min(U.length,6))).map(e=>{const c=evCounts(e),T=evTasks(e),td=T.filter(t=>t.faite).length;const j=evDays(e);
      const vis=e.img?`<img src="${e.img}" alt="">`:`<div class="ec-gen" style="--c:${CATCOL[e.categorie]}"><div class="ec-k"><i data-lucide="${CATIC[e.categorie]}" class="i i-sm"></i>${e.categorie}</div><div class="ec-t">${esc(e.titre)}</div><div class="ec-d">${evDateLong(e)} · ${evHeure(e).split(' – ')[0]}</div></div>`;
      return `<div class="evc" data-act="openEvt" data-id="${e.id}"><div class="evc-img">${vis}<span class="evc-j">${j===0?'Aujourd\'hui':j===1?'Demain':'J-'+j}</span></div>
      <div class="evc-f"><span title="Participent"><i data-lucide="users" class="i i-sm"></i><b>${c.oui}</b> participent${c.pe?` · ${c.pe} peut-être`:''}</span><span title="Tâches" class="${T.length&&td<T.length?'warn':''}"><i data-lucide="list-checks" class="i i-sm"></i><b>${T.length?td+'/'+T.length:'—'}</b></span></div></div>`}).join('')}</div>`;
  else h+=`<div class="card empty mb">Aucun événement prévu.<br><button class="btn mt" data-act="newEvt">Créer un événement</button></div>`;
  h+=bdBanner(p);
  h+=(typeof myPayCard==='function'?myPayCard(p)+myLateBlock(p):'');
  const todo=DB.tasks.filter(t=>!t.faite&&evt(t.evtId)&&!evt(t.evtId).annule&&!evPast(evt(t.evtId))).sort((a,b)=>evt(a.evtId).debut.localeCompare(evt(b.evtId).debut));
  h+=`<div><div class="card mb"><h3><i data-lucide="list-todo" class="i"></i>Tâches à faire<span class="r">${todo.length}</span></h3>

  ${newMembers(p)}
</div>`;
  return h}

/* ---- Actions ---- */
function shrinkImg(file,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const W=1200,s=Math.min(1,W/im.width);const cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.82),im.width,im.height)};im.onerror=()=>toast('Image illisible.');im.src=r.result};r.readAsDataURL(file)}
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||!t.dataset.img)return;const p=pane(t.closest('[data-pane]').dataset.pane);const f=t.files[0];if(!f)return;
  shrinkImg(f,(u,w,hh)=>{p.f[t.dataset.img]=u;const wn=document.getElementById(`warn-${t.dataset.img}-${p.id}`);if(wn){const r=w/hh;wn.style.display=Math.abs(r-BAN_W/BAN_H)>0.15?'':'none';wn.innerHTML=`Ton image fait <b>${w} × ${hh} px</b> : elle sera recadrée pour tenir en ${BAN_W} × ${BAN_H}. Pour un meilleur rendu, prépare-la à ces dimensions.`}const im=document.getElementById(`prev-${t.dataset.img}-${p.id}`),ph=document.getElementById(`ph-${t.dataset.img}-${p.id}`);if(im){im.src=u;im.style.display=''}if(ph)ph.style.display='none'})});
function val(p,k){const el=document.getElementById(`${k}-${p.id}`);return el?el.value.trim():''}
function evAction(a,p,d,el){
  switch(a){
    case'openEvt':closeModal();p.sub={evt:+d.id};p.f.epf='oui';renderPane(p);return true;
    case'newEvt':p.sub='newevt';p.f.evImg=undefined;renderPane(p);return true;
    case'editEvt':p.sub={editEvt:+d.id};p.f.evImg=undefined;renderPane(p);return true;
    case'saveEvt':{const t=val(p,'ev-t'),dt=val(p,'ev-d'),h1=val(p,'ev-h1'),h2=val(p,'ev-h2');
      if(!t){toast('Donne un titre à l\'événement.');return true}if(!dt||!h1){toast('Indique la date et l\'heure de début.');return true}if(h2&&h2<h1){toast('L\'heure de fin est avant le début.');return true}
      const data={titre:t,categorie:val(p,'ev-c'),debut:dt+'T'+h1,fin:h2?dt+'T'+h2:null,lieu:val(p,'ev-l'),responsable:+val(p,'ev-r')||sMember(p).id,description:val(p,'ev-desc'),inscription:document.getElementById('ev-i-'+p.id).checked,img:p.f.evImg||''};
      let e;if(d.id){e=evt(+d.id);const moved=e.debut!==data.debut||e.lieu!==data.lieu;Object.assign(e,data);log(sessName(p),'Événement modifié',e.titre);
        notify({perm:'__tous'},'evenements',(moved?'Changement de date ou de lieu : ':'Événement mis à jour : ')+e.titre,`${evDateLong(e)} · ${evHeure(e)}${e.lieu?' · '+e.lieu:''}`,sAcct(p).id)}
      else{e=Object.assign({id:DB.seq++,annule:false,motif:'',creePar:sessName(p),creeLe:nowIso()},data);DB.events.push(e);log(sessName(p),'Événement créé',`${e.titre} — ${fdate(e.debut)}`);
        notify({perm:'__tous'},'evenements','Nouvel événement : '+e.titre,`${evDateLong(e)} · ${evHeure(e)}${e.lieu?' · '+e.lieu:''}`,sAcct(p).id)}
      p.sub={evt:e.id};p.f.evImg=undefined;toast(d.id?'Événement mis à jour : tout le monde est prévenu.':'Événement publié : tout le monde est prévenu.');refresh();return true}
    case'evRep':{const me=sMember(p);let r=rep(+d.id,me.id);if(!r){r={evtId:+d.id,mid:me.id};DB.evtRep.push(r)}r.reponse=d.v;toast(d.v==='oui'?'Super, on compte sur toi ! 🙌':d.v==='non'?'Merci de nous avoir prévenus.':'Noté. Tu peux changer d\'avis à tout moment.');refresh();return true}
    case'evPres':{let r=rep(+d.id,+d.m);if(!r){r={evtId:+d.id,mid:+d.m};DB.evtRep.push(r)}r.present=!r.present;persist();rerender(p);return true}
    case'evTask':{const t=DB.tasks.find(x=>x.id===+d.id);t.faite=!t.faite;if(t.faite)log(sessName(p),'Tâche terminée',`${t.libelle} — ${evt(t.evtId).titre}`);refresh();return true}
    case'evTaskDel':{DB.tasks=DB.tasks.filter(x=>x.id!==+d.id);refresh();return true}
    case'evTaskAdd':{const l=val(p,'tk-l'),r=+val(p,'tk-r')||null;if(!l){toast('Écris la tâche.');return true}DB.tasks.push({id:DB.seq++,evtId:+d.id,libelle:l,resp:r,echeance:'',faite:false});
      if(r){const e=evt(+d.id);notify({mid:r},'evenements','Nouvelle mission : '+l,`Pour « ${e.titre} » (${fdate(e.debut)}). Merci !`,sAcct(p).id)}toast(r?'Tâche ajoutée, la personne est prévenue.':'Tâche ajoutée.');refresh();return true}

    case'evCancelGo':{const e=evt(MCTX.evt),pp=pane(MCTX.pane);e.annule=true;e.motif=document.getElementById('cx-m').value.trim();DB.affiches.forEach(a=>{if(a.evtId===e.id)a.actif=false});
      notify({perm:'__tous'},'evenements','Événement annulé : '+e.titre,e.motif||'',sAcct(pp).id);log(sessName(pp),'Événement annulé',e.titre+(e.motif?' — motif : '+e.motif:''));closeModal();toast('Événement annulé, tout le monde est prévenu.');refresh();return true}
    case'openAff':{const x=DB.affiches.find(y=>y.id===+d.id);if(!x)return true;if(x.evtId&&evt(x.evtId)){p.sub={evt:x.evtId};renderPane(p);return true}
      openModal(`<img src="${x.img}" style="width:100%;border-radius:12px;display:block"><div class="row between mt"><div class="name">${esc(x.titre)}</div>${x.lien?`<a class="btn sm" href="${esc(x.lien)}" target="_blank" rel="noopener">Ouvrir le lien</a>`:''}</div><div class="foot"><button class="btn sec" data-act="closeModal">Fermer</button></div>`,{pane:p.id},true);return true}

    case'affToggle':{const x=DB.affiches.find(y=>y.id===+d.id);x.actif=!x.actif;toast(x.actif?'Bannière affichée.':'Bannière masquée.');refresh();return true}
    case'affMove':{const L=DB.affiches.slice().sort((a,b)=>a.ordre-b.ordre);const i=L.findIndex(x=>x.id===+d.id),j=i+(+d.v);if(j<0||j>=L.length)return true;[L[i],L[j]]=[L[j],L[i]];L.forEach((x,k)=>x.ordre=k);refresh();return true}
    case'affDel':{const x=DB.affiches.find(y=>y.id===+d.id);MCTX={pane:p.id,aff:x.id};openModal(`<h2>Supprimer cette bannière ?</h2><img src="${x.img}" style="width:100%;border-radius:10px;margin:8px 0"><div class="foot"><button class="btn sec" data-act="closeModal">Annuler</button><button class="btn danger" data-act="affDelGo">Supprimer</button></div>`);return true}

  }

/* ---- Rappels automatiques des événements (en vrai : tâche planifiée chaque matin sur le serveur) ---- */
function autoRappels(){let ch=false;upcoming().forEach(e=>{const d=evDays(e);e.rap=e.rap||{};
  const st=d===0?'jj':d===1?'j1':d<=7?'j7':null;if(!st||e.rap[st])return;e.rap[st]=true;ch=true;
  const quand=`${evDateLong(e)} · ${evHeure(e)}${e.lieu?' · '+e.lieu:''}`;
  const R=DB.evtRep.filter(r=>r.evtId===e.id);
  if(st==='j7')notify({perm:'__tous'},'evenements',`Dans ${d} jours : ${e.titre}`,quand+(e.inscription?' — dis-nous si tu viens !':''));
  if(st==='j1')notify({mids:DB.members.filter(m=>m.actif&&!R.some(r=>r.mid===m.id&&r.reponse==='non')).map(m=>m.id)},'evenements',`Demain : ${e.titre}`,quand);
  if(st==='jj')notify({mids:R.filter(r=>['oui','peut_etre'].includes(r.reponse)).map(r=>r.mid)},'evenements',`C'est aujourd'hui : ${e.titre}`,quand+' — on t\'attend !');
  if(e.responsable&&st!=='j7'){const T=evTasks(e).filter(t=>!t.faite).length,c=evCounts(e);notify({mid:e.responsable},'evenements',`${st==='jj'?'Aujourd\'hui':'Demain'} : ${e.titre} (tu organises)`,`${c.oui} participent, ${c.pe} peut-être${T?` · ${T} tâche${T>1?'s':''} pas encore faite${T>1?'s':''}`:' · toutes les tâches sont faites'}`)}
});if(ch)persist()}

function tOrig(t){return t.origine?t.origine+(t.dateOrig?(t.origine.startsWith('Réunion')?' du ':' le ')+fdate(t.dateOrig):''):''}
const ORIG=[['Réunion du bureau','Lors de la réunion du bureau'],['Réunion de la jeunesse','Lors de la réunion de la jeunesse'],['Décidé par le président','Par le président'],['Décidé par la trésorière','Par la trésorière']];
/* ================== RAPPELS & TÂCHES (secrétariat) ================== */
function tache(id){return DB.suivi.find(t=>t.id===id)}
function tEtat(t){if(t.faite)return['Fait','ok'];if(t.echeance&&t.echeance<today())return['En retard','late'];if(t.echeance&&t.echeance<=addD(3))return['Bientôt','gold'];return['À faire','mut']}

  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px"><span class="chip ${k}">${e}</span>${t.faite?'':`<button class="btn sec sm" data-act="tRemind" data-id="${t.id}"><i data-lucide="bell-ring" class="i i-sm"></i>Rappeler</button>`}</div></div>`}
function vRappels(p){const f=p.f.tf||'afaire';const all=DB.suivi.slice().sort((a,b)=>(a.echeance||'9999').localeCompare(b.echeance||'9999'));

function vTacheForm(p,id){const t=id?tache(id):null;const sel=p.f.tSel||(t?t.resp.slice():[]);p.f.tSel=sel;const q=norm(p.f.tq||'');

  <div class="field"><label>À faire avant le</label><input class="inp" type="date" id="tk-e-${p.id}" value="${t?t.echeance:p.f.tE||addD(7)}"></div>

  ${tous?'':`<div class="field"><input class="inp" placeholder="Rechercher un jeune…" data-fk="tq" data-live="1" value="${esc(p.f.tq||'')}" style="margin-bottom:6px"><div class="pick-list">${act.filter(m=>!q||norm(fullName(m)).includes(q)).map(m=>`<label class="pick"><input type="checkbox" data-tpick="${m.id}" ${sel.includes(m.id)?'checked':''}><span class="avatar sm">${initials(m.nom)}</span><span class="ellip">${esc(titleCase(fullName(m)))}</span></label>`).join('')}</div><div class="muted mt">${sel.length} personne${sel.length>1?'s':''} choisie${sel.length>1?'s':''}</div></div>`}

function vTacheDetail(p,id){const t=tache(id);if(!t)return'';const[e,k]=tEtat(t);

function seedSuivi(db){const id=()=>db.seq++;const M=db.members;const sec=db.accounts.find(a=>a.roleId==='secretaire');const sn='Nene Lou Marie Michelle (Secrétaire)';
  [['Préparer la liste des chants de Noël','Choisir 8 chants et les envoyer à la chorale.','Réunion du bureau',addD(5),[M[3].id,M[10].id],false,false],

   ['Venir en blanc au culte de dimanche','Toute la jeunesse est attendue en tenue blanche pour le culte de reconnaissance.','Réunion de la jeunesse',addD(1),[],true,false],

function tAction(a,p,d){
  switch(a){
    case'tNew':p.sub='tnew';['tSel','tTous','tq','tT','tD','tO','tOS','tE','tDO'].forEach(k=>delete p.f[k]);renderPane(p);return true;
    case'tEdit':p.sub={tedit:+d.id};['tSel','tTous','tq','tO','tOS'].forEach(k=>delete p.f[k]);renderPane(p);return true;
    case'tOpen':p.sub={tache:+d.id};renderPane(p);return true;
    case'tTous':{['t','d','o','e','do'].forEach(k=>{const v=val(p,'tk-'+k);if(v!=='')p.f['t'+k.toUpperCase()]=v});p.f.tOS=val(p,'tk-os');p.f.tTous=d.v==='1';rerender(p);return true}
    case'tSave':{const t0=d.id?tache(+d.id):null;const titre=val(p,'tk-t');if(!titre){toast('Écris ce qu\'il faut faire.');return true}

  const w=document.createElement('div');w.className='pw-wrap';i.parentNode.insertBefore(w,i);w.appendChild(i);
  w.insertAdjacentHTML('beforeend','<button type="button" class="pw-eye" data-act="pwEye" aria-label="Afficher le mot de passe"><i data-lucide="eye" class="i i-sm"></i></button>');icons()})}
new MutationObserver(()=>pwEyes()).observe(document.documentElement,{childList:true,subtree:true});

function readMemberForm(){const nom=gv('f-nom').toUpperCase(),prenoms=gv('f-prenoms').toUpperCase(),tel=gv('f-tel'),email=gv('f-email').toLowerCase();
  const an=readAnniv();const fon=gv('f-fonction');
  return{nom,prenoms,tel:tel||null,email:email||null,anniv_jour:an?+an.slice(3):null,anniv_mois:an?+an.slice(0,2):null,baptise:FORMBAP,profession:gv('f-prof')||null,habitation:gv('f-hab')||null,
    departement_id:FORMDEP.length?DB.depIds[FORMDEP[0]]||null:null,fonction_id:fon&&fon!=='Membre'?DB.fonIds[fon]||null:(DB.fonIds['Membre']||null),adhesion:gv('f-adh')||undefined}}
API.saveMember=async(p,d)=>{const r=readMemberForm();if(!r.nom){toast('Le nom est obligatoire.');return'nosync'}
  if(r.email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r.email)){toast('E-mail invalide.');return'nosync'}
  const id=d.id?+d.id:null;
  const dup=DB.members.find(m=>m.id!==id&&!m.partiel&&((r.email&&m.email===r.email)||norm(fullName(m))===norm(r.nom+r.prenoms)));if(dup){toast(`Déjà enregistré : ${fullName(dup)}`);return'nosync'}
  const depIds=FORMDEP.map(n=>DB.depIds[n]).filter(Boolean);
  if(id){const act=gv('f-actif');if(act)r.actif=act==='1';await must(sb.from('membres').update(r).eq('id',U(id)));await rpc('definir_departements',{p_membre:U(id),p_departements:depIds});closeModal();toast('Fiche mise à jour.');return}
  const wantAcc=document.getElementById('f-access')?.checked;const row=await must(sb.from('membres').insert(r).select().single());await rpc('definir_departements',{p_membre:row.id,p_departements:depIds});
  if(wantAcc&&(r.tel||r.email)){const res=await fn('creer-acces',{membre_id:row.id,role:'membre'});await sync();showCreds(I(row.id),res,'Jeune enregistré · accès créé');return'nosync'}
  closeModal();toast(wantAcc?'Enregistré. Pas d\'accès : il faut un téléphone ou un e-mail.':'Jeune enregistré.')};
API.confirmInactive=async(p,d)=>{await must(sb.from('membres').update({actif:false}).eq('id',U(d.id)));closeModal();toast('Membre inactif. Son accès est bloqué, son historique est gardé.')};
API.setActive=async(p,d)=>{await must(sb.from('membres').update({actif:true}).eq('id',U(d.id)));toast('Membre réactivé.')};
API.listRemove=async(p,d)=>{const k=d.k,t=k==='departements'?'departements':'fonctions';const used=DB.members.filter(m=>k==='departements'?depsOf(m).includes(d.v):m.fonction===d.v).length;
  if(used){toast(`${used} jeune${used>1?'s ont':' a'} « ${d.v} » sur sa fiche : change-les d'abord.`);return'nosync'}
  await must(sb.from(t).delete().eq('id',k==='departements'?DB.depIds[d.v]:DB.fonIds[d.v]));toast('Retiré de la liste.')};
API.confirmImport=async()=>{if(!IMPORT)return'nosync';const sel=[...document.querySelectorAll('.imp-chk')].filter(c=>c.checked).map(c=>IMPORT.rows[+c.dataset.i]);const acc=document.getElementById('imp-acc').checked;
  const missing=[...new Set(sel.flatMap(o=>[...depsOf(o).filter(x=>!DB.depIds[x]).map(x=>['departements',x]),o.fonction&&o.fonction!=='Membre'&&!DB.fonIds[o.fonction]?['fonctions',o.fonction]:null]).filter(Boolean).map(JSON.stringify))].map(JSON.parse);
  for(const[t,nom]of missing){await sb.from(t).insert({nom})}
  const lignes=sel.map(o=>({nom:o.nom,prenoms:o.prenoms,tel:o.tel,email:o.email,anniversaire:o.anniv?o.anniv.slice(3)+'/'+o.anniv.slice(0,2):'',baptise:o.baptise?'oui':'non',profession:o.profession,habitation:o.habitation,departement:o.departement,fonction:o.fonction==='Membre'?'':o.fonction}));
  const res=await rpc('importer_jeunes',{p_lignes:lignes});IMPORT=null;closeModal();await sync();
  let created=[];if(acc){const sans=DB.members.filter(m=>!m.partiel&&m.actif&&!acctOfMember(m.id)&&(m.tel||m.email)&&lignes.some(l=>norm(l.nom)===norm(m.nom)&&norm(l.prenoms||'')===norm(m.prenoms)));
    for(const m of sans){try{const r=await fn('creer-acces',{membre_id:m.uuid,role:'membre'});created.push({m,r})}catch(_){}}await sync()}
  const errs=res.erreurs||[];openModal(`<h2>Import terminé</h2><div class="receipt mt"><div class="rl"><span>Jeunes ajoutés</span><b>${res.ajoutes}</b></div><div class="rl"><span>Déjà présents (ignorés)</span><b>${res.ignores}</b></div>${acc?`<div class="rl"><span>Accès créés</span><b>${created.length}</b></div>`:''}${errs.length?`<div class="rl"><span>Lignes en erreur</span><b style="color:var(--red)">${errs.length}</b></div>`:''}</div>
  ${errs.length?`<div class="info red mt" style="font-size:12px">${errs.slice(0,8).map(x=>`Ligne ${x.ligne} (${esc(x.nom||'?')}) : ${esc(x.erreur)}`).join('<br>')}</div>`:''}
  ${created.length?`<div class="info gold mt" style="font-size:12px">Télécharge la liste des identifiants et mots de passe provisoires maintenant : elle ne pourra plus être affichée ensuite.</div>`:''}
  <div class="foot">${created.length?'<button class="btn sec" data-act="dlCreds">Télécharger les accès (Excel)</button>':''}<button class="btn" data-act="closeModal">Terminé</button></div>`,{pane:'m'});LASTCREDS=created;return'nosync'};

      await natSave(r.doc.output('blob'),r.name,text)}catch(e){toast(e.message||'PDF indisponible.')}};
  /* Liens externes (WhatsApp, téléphone, SMS, e-mail) : ouverts dans l'application concernée */
  const ext=u=>{try{const A=PL('AppLauncher');if(A&&A.openUrl)return A.openUrl({url:u})}catch(e){}location.href=u};
  window.open=(u)=>{if(u)ext(String(u));return null};
  document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(!a)return;const h=a.getAttribute('href');
    if(/^(https?:|tel:|sms:|mailto:|whatsapp:)/i.test(h)&&!h.startsWith(location.origin)){e.preventDefault();e.stopPropagation();ext(a.href)}},true);
  /* Bouton retour Android : ferme la fenêtre ouverte, revient en arrière, sinon met l'appli en arrière-plan */
  PL('App').addListener('backButton',()=>{
    if(document.getElementById('modalBg').classList.contains('show')){closeModal();return}
    const p=PANES&&PANES[0];if(p&&p.session&&p.sub){p.sub=null;renderPane(p);return}
    if(p&&p.session&&!p.session.mustChange){const t0=tabsFor(p)[0][0];if(p.tab&&p.tab!==t0){p.tab=t0;renderPane(p);return}}
    PL('App').minimizeApp()});
  try{PL('StatusBar').setStyle({style:'LIGHT'});PL('StatusBar').setBackgroundColor({color:'#FFFFFF'})}catch(e){}
  try{majAuto()}catch(e){console.warn(e)}
  try{if(!Capacitor.isPluginAvailable||Capacitor.isPluginAvailable('PushNotifications'))pushNatif()}catch(e){console.warn('push',e)}
}

/* ---- Notifications Android (Firebase Cloud Messaging) ---- */
function pushNatif(){const PN=PL('PushNotifications');if(!PN)return;const LS='younity-fcm';
  const tok=()=>{try{return localStorage.getItem(LS)}catch(_){return null}};
  PN.createChannel({id:'younity',name:'Younity',description:'Paiements, rappels, événements, tâches',importance:4,visibility:1,vibration:true,lights:true,lightColor:'#135C2E'}).catch(()=>{});
  PN.addListener('registration',async t=>{try{localStorage.setItem(LS,t.value)}catch(_){}
    if(PANES[0]&&PANES[0].session)await rpc('enregistrer_abonnement',{p_endpoint:'fcm:'+t.value,p_p256dh:'fcm',p_auth:'fcm',p_appareil:'Application Android'}).catch(e=>console.warn('fcm',e));
    PUSH_ETAT='?'});
  PN.addListener('registrationError',e=>console.warn('fcm',e));
  PN.addListener('pushNotificationActionPerformed',()=>{const p=PANES[0];if(p&&p.session&&!p.session.mustChange){p.sub='notifs';p.notif=null;renderPane(p);if(typeof sync==='function')sync()}});
  PN.addListener('pushNotificationReceived',()=>{if(typeof sync==='function')sync()});
  const perm=async()=>{try{return(await PN.checkPermissions()).receive}catch(_){return'denied'}};
  pushEtat=async()=>{const r=await perm();return r==='denied'?'refuse':r==='granted'&&tok()?'actif':'inactif'};
  activerPush=async(sil)=>{let r=await perm();if(r!=='granted'&&r!=='denied')r=(await PN.requestPermissions()).receive;
    if(r!=='granted'){if(!sil)toast('Notifications refusées. Autorise-les dans Réglages > Applications > Younity > Notifications.');return false}
    await PN.register();PUSH_ETAT='?';if(!sil)toast('Notifications activées sur ce téléphone 🔔');return true};
  desactiverPush=async()=>{const t=tok();if(t)await rpc('supprimer_abonnement',{p_endpoint:'fcm:'+t}).catch(()=>{});
    await PN.unregister().catch(()=>{});try{localStorage.removeItem(LS)}catch(_){}PUSH_ETAT='?'};
  pushApresConnexion=async()=>{const r=await perm();if(r==='granted'){activerPush(true).catch(()=>{});return}if(r==='denied')return;
    let plusTard=0;try{plusTard=+localStorage.getItem('younity-push-plustard')||0}catch(_){}if(Date.now()-plusTard<7*864e5)return;
    setTimeout(()=>{if(document.getElementById('modalBg').classList.contains('show')||!PANES[0].session||PANES[0].session.mustChange)return;
      openModal(`<div style="text-align:center"><div class="avatar" style="margin:0 auto 12px;width:56px;height:56px;background:var(--green-soft);color:var(--green)"><i data-lucide="bell-ring" class="i" style="width:28px;height:28px"></i></div>
      <h2>Recevoir les notifications ?</h2><div class="muted">Younity te prévient sur ce téléphone, même quand l'application est fermée : paiements, rappels de cotisation, événements, tâches, anniversaires.</div></div>
      <div class="foot"><button class="btn sec" data-act="pushPlusTard">Plus tard</button><button class="btn" data-act="pushActiver"><i data-lucide="bell" class="i i-sm"></i>Activer</button></div>`,{pane:'m'})},1500)};
}

/* ---- Mises à jour automatiques en arrière-plan ----
   L'appli vérifie https://kngpa.github.io/Younity-/natif/version.json au démarrage et au retour dans l'appli.
   Si une version plus récente existe, elle la télécharge en silence ; elle s'installe la prochaine fois que
   l'appli passe en arrière-plan (aucune action du jeune, pas de Play Store). */
const MAJ_URL='https://kngpa.github.io/Younity-/natif/version.json';
function vNum(v){return String(v||'0').split('.').map(x=>+x||0).reduce((a,x)=>a*1000+x,0)}
let MAJ_T=0,MAJ={etat:'',v:'',pct:0,id:null};
/* Petite barre en bas de l'écran : téléchargement puis « mise à jour prête » */
function majBar(){let el=document.getElementById('majBar');
  if(!MAJ.etat||MAJ.ferme){if(el)el.remove();return}
  if(!el){el=document.createElement('div');el.id='majBar';document.body.appendChild(el)}
  el.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:9000;background:#123a26;color:#fff;border-radius:14px;padding:10px 12px 10px 14px;display:flex;align-items:center;gap:10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);width:min(92vw,420px)';
  el.innerHTML=MAJ.etat==='dl'?`<i data-lucide="download" class="i i-sm"></i><div style="flex:1"><b>Mise à jour ${esc(MAJ.v)}</b> en téléchargement…<div style="height:4px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:6px;overflow:hidden"><i style="display:block;height:100%;width:${MAJ.pct}%;background:#F2B233"></i></div></div>`
   :`<i data-lucide="sparkles" class="i i-sm" style="color:#F2B233"></i><div style="flex:1"><b>Mise à jour ${esc(MAJ.v)} prête</b><div style="opacity:.75;font-size:11.5px">Elle s'installera à la prochaine ouverture</div></div><button data-act="majOk" style="background:#F2B233;color:#1a1a1a;border:0;border-radius:10px;padding:8px 10px;font-weight:800;font-size:12.5px">Installer</button><button data-act="majX" style="background:none;border:0;color:#fff;opacity:.7;font-size:18px;padding:0 4px">×</button>`;
  try{lucide.createIcons()}catch(_){}}
document.addEventListener('click',async e=>{const b=e.target.closest&&e.target.closest('#majBar [data-act],[data-act="majCheck"]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();const a=b.dataset.act;const U=PL('CapacitorUpdater');
  if(a==='majOk'&&MAJ.id){toast('Installation de la mise à jour…');await U.set({id:MAJ.id})}
  if(a==='majX'){MAJ.ferme=true;majBar()}
  if(a==='majCheck'){MAJ_T=0;toast('Recherche d\'une mise à jour…');const r=await majVerif(true);if(r==='rien')toast(`Younity est à jour (version ${window.YV}).`)}},true);
async function majVerif(manuel){const U=PL('CapacitorUpdater');if(!U||(!manuel&&Date.now()-MAJ_T<10*60000))return;MAJ_T=Date.now();
  try{const r=await fetch(MAJ_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const j=await r.json();
    if(vNum(j.version)<=vNum(window.YV))return'rien';
    const L=await U.list();let b=(L.bundles||[]).find(x=>x.version===j.version&&x.status!=='error');
    if(!b){Object.assign(MAJ,{etat:'dl',v:j.version,pct:0,ferme:false});majBar();b=await U.download({url:j.url,version:j.version})}
    await U.next({id:b.id});Object.assign(MAJ,{etat:'pret',v:j.version,id:b.id});majBar();
    if(j.forcer)await U.set({id:b.id});return'ok'
  }catch(e){console.warn('maj',e);MAJ.etat='';majBar();if(manuel)toast('Mise à jour impossible pour le moment (connexion ?).')}}
function majAuto(){const U=PL('CapacitorUpdater');
  if(location.hostname!=='localhost'){try{U&&U.notifyAppReady().catch(()=>{})}catch(_){}
    const vp0=vProfil;vProfil=function(p){return vp0(p)+`<div class="card mt"><div class="name" style="font-size:13.5px">Younity ${esc(window.YV)} · application Android</div><div class="muted">Toujours à jour : chaque ouverture charge la dernière version.</div></div>`};return}
  if(!U)return;
  U.notifyAppReady().catch(()=>{});
  try{U.addListener('download',d=>{if(MAJ.etat==='dl'){MAJ.pct=Math.round(d.percent||0);majBar()}})}catch(_){}
  setTimeout(()=>majVerif(),4000);
  PL('App').addListener('appStateChange',s=>{if(s.isActive)majVerif()});
  /* Version affichée dans Mon profil, avec un bouton pour vérifier tout de suite */
  const vp=vProfil;vProfil=function(p){return vp(p)+`<div class="card mt" style="display:flex;align-items:center;gap:12px"><div style="flex:1"><div class="name" style="font-size:13.5px">Younity ${esc(window.YV)} · application Android</div><div class="muted">Les mises à jour s'installent toutes seules.</div></div><button class="btn sec sm" data-act="majCheck"><i data-lucide="refresh-cw" class="i i-sm"></i>Vérifier</button></div>`}}

/* Version web (navigateur / ancienne appli Chrome) : on l'indique dans Mon profil */
if(!NATIF){const vpw=vProfil;vProfil=function(p){return vpw(p)+`<div class="card mt"><div class="name" style="font-size:13.5px">Younity ${esc(window.YV)} · version navigateur</div><div class="muted mb">Tu utilises Younity dans le navigateur (Chrome). Pour l'application Android avec ses propres notifications, installe-la :</div><a class="btn sec sm" href="https://kngpa.github.io/android" target="_blank" rel="noopener"><i data-lucide="download" class="i i-sm"></i>Installer l'application Android</a></div>`}}

/* ---- Tirer l'écran vers le bas pour actualiser (téléphone et tablette) ---- */
(function(){let y0=null,dy=0,sc=null,busy=false,el=null;const SEUIL=72;
  const ind=()=>{if(!el){el=document.createElement('div');el.id='ptr';el.innerHTML='<i data-lucide="refresh-cw" class="i"></i>';
    el.style.cssText='position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 8px);width:40px;height:40px;margin-left:-20px;border-radius:50%;background:#fff;color:#135C2E;box-shadow:0 4px 16px rgba(0,0,0,.18);display:grid;place-items:center;z-index:8000;opacity:0;transform:translateY(-50px);pointer-events:none';
    document.body.appendChild(el);try{lucide.createIcons({nodes:[el]})}catch(_){try{lucide.createIcons()}catch(__){}}}return el};
  const pose=(d,anim)=>{const e=ind();const k=Math.min(d,110);e.style.transition=anim?'transform .25s,opacity .25s':'none';e.style.transform=`translateY(${k-50}px) rotate(${k*3}deg)`;e.style.opacity=Math.min(1,k/SEUIL)};
  document.addEventListener('touchstart',e=>{if(busy||e.touches.length!==1||document.getElementById('modalBg')?.classList.contains('show')||document.getElementById('spWrap'))return;
    if(!PANES[0]||!PANES[0].session)return;
    sc=e.target.closest&&e.target.closest('.m-body,.w-main');const s=sc||document.scrollingElement;if(s.scrollTop>0||document.scrollingElement.scrollTop>0){y0=null;return}
    y0=e.touches[0].clientY;dy=0},{passive:true});
  document.addEventListener('touchmove',e=>{if(y0===null||busy)return;dy=(e.touches[0].clientY-y0)*0.5;if(dy>4)pose(dy)},{passive:true});
  document.addEventListener('touchend',async()=>{if(y0===null||busy)return;y0=null;
    if(dy<SEUIL){pose(0,true);return}
    busy=true;const e=ind();e.style.transition='transform .2s';e.style.transform='translateY(20px)';e.style.opacity=1;e.firstElementChild&&(e.firstElementChild.style.animation='ptrspin .8s linear infinite');
    if(await nouvelleVersion(true))return;const t0=LASTSYNC;try{await sync(true)}catch(_){}toast(LASTSYNC!==t0?'À jour ✓':'Pas de connexion internet.')
    if(e.firstElementChild)e.firstElementChild.style.animation='';pose(0,true);busy=false},{passive:true});
  const st=document.createElement('style');st.textContent='@keyframes ptrspin{to{transform:rotate(360deg)}}';document.head.appendChild(st)})();

/* ---- Bouton « Actualiser » (ordinateur, écrans sans geste tactile) ---- */
document.addEventListener('click',async e=>{const b=e.target.closest&&e.target.closest('[data-act="actualiser"]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();
  if(b.dataset.busy)return;b.dataset.busy=1;const i=b.querySelector('svg,i');if(i)i.style.animation='ptrspin .8s linear infinite';
  if(await nouvelleVersion(true))return;const t0=LASTSYNC;try{await sync(true)}catch(_){}toast(LASTSYNC!==t0?'À jour ✓':'Pas de connexion internet.');
  const b2=document.querySelector('[data-act="actualiser"]');if(b2){delete b2.dataset.busy;const i2=b2.querySelector('svg,i');if(i2)i2.style.animation=''}},true);


/* ---- Nouvelle version : bandeau « Mise à jour disponible » ; un toucher l'installe tout de suite ----
   Version web et appli Android 2.2.0+ (qui charge le site) : on recharge la page sur la nouvelle version.
   Ancienne appli Android (écrans intégrés) : téléchargement puis installation immédiate. */
let NV=null,NV_T=0;
async function lireVersion(){const r=await fetch('https://kngpa.github.io/Younity-/natif/version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;return r.json()}
async function appliquerVersion(j){
  if(NATIF&&location.hostname==='localhost'){const U=PL('CapacitorUpdater');if(U){toast('Installation de la mise à jour…');
    try{const L=await U.list();let b=(L.bundles||[]).find(x=>x.version===j.version&&x.status!=='error');if(!b)b=await U.download({url:j.url,version:j.version});await U.set({id:b.id});return}catch(e){toast('Mise à jour impossible pour le moment.');return}}}
  toast('Mise à jour en cours…');try{const rs=await navigator.serviceWorker?.getRegistrations?.();(rs||[]).forEach(r=>r.update().catch(()=>{}))}catch(_){}
  setTimeout(()=>location.replace(location.pathname+'?v='+encodeURIComponent(j.version)+location.hash),350)}
function bandeauVersion(j){let el=document.getElementById('nvBar');if(!j){if(el)el.remove();return}
  if(!el){el=document.createElement('button');el.id='nvBar';el.type='button';document.body.appendChild(el);el.addEventListener('click',()=>appliquerVersion(NV))}
  el.style.cssText='position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 10px);z-index:9500;background:#135C2E;color:#fff;border:0;border-radius:14px;padding:11px 14px;display:flex;align-items:center;gap:10px;font:600 13.5px/1.3 inherit;box-shadow:0 10px 30px rgba(0,0,0,.25);width:min(92vw,420px);text-align:left;cursor:pointer';
  el.innerHTML=`<span style="width:30px;height:30px;border-radius:50%;background:#F2B233;color:#1a1a1a;display:grid;place-items:center;flex:none;font-size:16px">↻</span><span style="flex:1"><b>Mise à jour disponible</b><br><span style="opacity:.8;font-weight:500;font-size:12px">Younity ${esc(j.version)} · touche pour l'installer</span></span><span style="background:#F2B233;color:#1a1a1a;border-radius:10px;padding:7px 10px;font-weight:800;font-size:12.5px">Installer</span>`}
async function nouvelleVersion(appliquer){try{const j=await lireVersion();NV_T=Date.now();
    if(vNum(j.version)>vNum(window.YV)){NV=j;if(appliquer){appliquerVersion(j);return true}bandeauVersion(j);
      if(!nouvelleVersion.vu){nouvelleVersion.vu=1;try{if(typeof notifLocale==='function')notifLocale(j)}catch(_){}}return true}
    NV=null;bandeauVersion(null)}catch(_){}return false}
if(!(NATIF&&location.hostname==='localhost')){
  setTimeout(()=>nouvelleVersion(false),5000);
  setInterval(()=>{if(document.visibilityState==='visible')nouvelleVersion(false)},5*60000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-NV_T>60000)nouvelleVersion(false)});
}

boot();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!NATIF)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
