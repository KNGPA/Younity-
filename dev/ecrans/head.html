<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Younity — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --green:#17603f; --green-2:#1f7a52; --green-soft:#e6f2ec; --ok:#17603f; --ok-soft:#e6f2ec; --gold:#d99a1e; --gold-soft:#fbf1dc;
  --red:#c43d3d; --red-soft:#fbe6e6; --amber:#d9821e; --amber-soft:#fdf0de;
  --ink:#16211c; --ink-2:#4a5852; --ink-3:#86938d; --line:#e3e8e5; --bg:#f4f6f5; --card:#fff;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:#dfe6e2;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.i{width:18px;height:18px;stroke-width:2;vertical-align:middle;flex:none}
.i-sm{width:15px;height:15px}

/* ===== Top bar ===== */
.topbar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em}
.brand .logo{width:30px;height:30px;border-radius:9px;background:var(--gold);display:grid;place-items:center;color:var(--ink)}
.brand small{display:block;font-weight:500;color:#a9b8b1;font-size:11.5px;letter-spacing:0}
.seg{display:flex;background:#2b3833;border-radius:10px;padding:3px;margin-left:auto}
.seg button{border:0;background:transparent;color:#c5d1cb;padding:7px 12px;border-radius:8px;font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center}
.seg button.on{background:#fff;color:var(--ink)}
.ghost-dark{border:1px solid #3d4c46;background:transparent;color:#c5d1cb;padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.banner{background:var(--gold-soft);color:#6b4a07;font-size:12.5px;padding:7px 18px;border-bottom:1px solid #f0dfb8;display:flex;gap:8px;align-items:center}

/* ===== Stage ===== */
.stage{padding:22px;display:flex;justify-content:center;gap:28px;flex-wrap:wrap;align-items:flex-start}
.pane-wrap{display:flex;flex-direction:column;align-items:center;gap:10px}
.pane-cap{font-size:12.5px;font-weight:700;color:var(--ink-2);background:#fff;padding:5px 12px;border-radius:99px}
.hint{max-width:860px;margin:0 auto;text-align:center;color:var(--ink-2);font-size:13px;padding:14px 18px 0}

/* phone */
.phone{width:390px;height:800px;background:#111;border-radius:46px;padding:11px;box-shadow:0 30px 60px -20px rgba(0,0,0,.35)}
.phone .screen{width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;position:relative}
.m-status{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:12px;font-weight:700;background:var(--card)}
.m-head{flex:none;background:var(--card);padding:6px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.m-head h1{font-size:18px;margin:0;letter-spacing:-.02em}
.m-head .sub{font-size:12px;color:var(--ink-3)}
.m-body{flex:1;overflow-y:auto;padding:14px 14px 20px}
.m-nav{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px 14px}
.m-nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink-3);padding:6px 0}
.m-nav button.on{color:var(--green)}
.full-mobile .phone{width:100%;height:auto;min-height:calc(100vh - 110px);padding:0;border-radius:0;background:none;box-shadow:none}
.full-mobile .phone .screen{border-radius:0;min-height:calc(100vh - 110px)}
.full-mobile .m-status{display:none}
.full-mobile .m-nav{position:sticky;bottom:0}
.full-mobile .stage{padding:0}
.full-mobile .seg,.full-mobile #hint{display:none}
.full-mobile .topbar .ghost-dark{margin-left:auto}
.camp-t td:first-child{min-width:200px}

/* web */
.web{width:min(1240px,calc(100vw - 44px));background:var(--bg);border-radius:16px;overflow:hidden;box-shadow:0 20px 50px -25px rgba(0,0,0,.35);display:grid;grid-template-columns:232px 1fr;min-height:760px}
.side{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}
.side .who{display:flex;gap:10px;align-items:center;padding:8px 10px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
.side a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--ink-2);font-weight:600;text-decoration:none;cursor:pointer}
.side a.on{background:var(--green-soft);color:var(--green)}
.side a:hover:not(.on){background:#f2f5f3}
.side .grow{flex:1}
.w-main{padding:26px 30px;overflow:auto;max-height:820px}
.w-title{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.w-title h1{font-size:23px;margin:0;letter-spacing:-.02em}
.w-title .sub{color:var(--ink-3);font-size:13px}
.w-title .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

/* components */
.avatar{width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.avatar.gold{background:var(--gold);color:var(--ink)}
.avatar.sm{width:30px;height:30px;font-size:11.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{margin:0 0 12px;font-size:14.5px;display:flex;align-items:center;gap:8px}
.card h3 .r{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--ink-3)}
.grid{display:grid;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .l{font-size:12px;color:var(--ink-3);font-weight:600;display:flex;gap:6px;align-items:center}
.kpi .v{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.mobile .kpis{grid-template-columns:1fr 1fr;gap:10px}
.mobile .kpi{padding:12px}
.mobile .kpi .v{font-size:17px}
.btn{text-decoration:none;border:0;border-radius:10px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;gap:7px;justify-content:center;background:var(--green);color:#fff;font-size:13.5px}
.btn:hover{background:var(--green-2)}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:#f4f6f5}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn.danger{background:var(--red)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{border:0;background:none;color:var(--green);font-weight:700;padding:0;font-size:12.5px;display:inline-flex;gap:4px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.late{background:var(--red-soft);color:var(--red)}
.chip.part{background:var(--amber-soft);color:var(--amber)}
.chip.mut{background:#eef1ef;color:var(--ink-2)}
.chip.gold{background:var(--gold-soft);color:#8a6110}
.bar{height:8px;background:#e9eeeb;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:99px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fafbfa}
.t td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.name{font-weight:700}
.muted{color:var(--ink-3);font-size:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.list-item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700;color:var(--ink-2)}
.inp{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;width:100%;outline:none}
.inp:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.inp.big{font-size:22px;font-weight:800;padding:12px 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 12px;font-weight:600;font-size:13px}
.pill.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.search{position:relative}
.search .i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{padding-left:36px}
.info{background:var(--green-soft);border-radius:12px;padding:12px 14px;font-size:13px;color:#174a33}
.info.gold{background:var(--gold-soft);color:#6b4a07}
.info.red{background:var(--red-soft);color:#7d2020}
.empty{text-align:center;color:var(--ink-3);padding:30px 10px}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.months{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mo{border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;font-weight:700;border:1px solid transparent}
.mo b{display:block;font-size:12px;margin-top:2px}
.mo.paye{background:var(--ok-soft);color:var(--ok)}
.mo.partiel{background:var(--amber-soft);color:var(--amber)}
.mo.du{background:var(--red-soft);color:var(--red)}
.mo.avenir{background:#f0f3f1;color:var(--ink-3)}
.mo.cur{border-color:currentColor}
.cell{display:inline-block;min-width:54px;text-align:center;border-radius:6px;padding:4px 3px;font-size:11.5px;font-weight:700}
.cell.paye{background:var(--ok-soft);color:var(--ok)}
.cell.partiel{background:var(--amber-soft);color:var(--amber)}
.cell.du{background:var(--red-soft);color:var(--red)}
.cell.avenir{background:#f3f5f4;color:#a9b4af}
.dots{display:flex;gap:3px;margin-top:6px}
.dots i{flex:1;height:6px;border-radius:3px;background:#e6ebe8}
.dots i.paye{background:var(--ok)} .dots i.partiel{background:var(--amber)} .dots i.du{background:var(--red)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bars{position:relative;width:100%;max-width:38px;flex:1;display:flex;align-items:flex-end}
.chart .bars .a{position:absolute;bottom:0;left:0;right:0;background:#e3eae6;border-radius:6px 6px 0 0}
.chart .bars .p{position:absolute;bottom:0;left:6px;right:6px;background:var(--green);border-radius:5px 5px 0 0}
.chart .col.cur .bars .p{background:var(--gold)}
.chart .lab{font-size:10.5px;color:var(--ink-3);font-weight:700}
.hero{background:linear-gradient(140deg,var(--green) 0%,#0f4a30 100%);color:#fff;border-radius:18px;padding:18px;position:relative;overflow:hidden}
.hero .l{font-size:12px;opacity:.8;font-weight:600}
.hero .big{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:2px 0 12px}
.hero .bar{background:rgba(255,255,255,.2)}
.hero .bar>i{background:var(--gold)}
.hero .split{display:flex;justify-content:space-between;margin-top:12px;font-size:12px}
.hero .split b{display:block;font-size:15px}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.06)}
.notif{position:absolute;left:12px;right:12px;top:44px;z-index:5;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 12px 30px -10px rgba(0,0,0,.5);animation:drop .35s ease}
.notif .t1{font-weight:700;font-size:13px}.notif .t2{font-size:12px;color:#c5d1cb;margin-top:2px}
@keyframes drop{from{transform:translateY(-20px);opacity:0}to{transform:none;opacity:1}}
.web .notif{position:fixed;left:auto;right:24px;top:120px;width:340px}
.toggle{width:44px;height:26px;border-radius:99px;background:#d5ddd9;position:relative;border:0;flex:none}
.toggle:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.toggle.on{background:var(--green)}
.toggle.on:after{left:21px}
.login{flex:1;display:flex;flex-direction:column;padding:28px 22px;background:linear-gradient(180deg,#fff 0%,var(--bg) 100%);overflow:auto}
.login .logo{width:58px;height:58px;border-radius:18px;background:var(--green);color:var(--gold);display:grid;place-items:center;margin-bottom:16px}
.login h2{margin:0;font-size:24px;letter-spacing:-.02em}
.prof{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;margin-bottom:8px;width:100%;text-align:left}
.prof:hover{border-color:var(--green)}
.prof .grow{flex:1}
.web-login{grid-column:1/-1;display:grid;place-items:center;padding:40px}
.web-login .box{width:420px;max-width:100%}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,25,20,.45);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:18px;width:560px;max-width:100%;max-height:88vh;overflow:auto;padding:22px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4)}
.modal.wide{width:860px}
.modal h2{margin:0 0 4px;font-size:19px;letter-spacing:-.02em}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.receipt{border:1.5px dashed var(--line);border-radius:14px;padding:18px}
.receipt .rl{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;border-bottom:1px solid #f0f2f1}
.receipt .rl:last-child{border:0}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;font-size:13px;z-index:60;display:none;max-width:90vw}
.toast.show{display:block;animation:drop .3s}
.web-only{} .mob-only{display:none}
.mobile .web-only{display:none} .mobile .mob-only{display:block}
@media (max-width:760px){
  .topbar{padding:10px 12px}
  .seg button{flex:1;justify-content:center}
  .banner{padding:7px 12px}
}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .pill{padding:6px 11px;font-size:12.5px}
.filters .pill .n{background:#eef1ef;border-radius:99px;padding:0 6px;margin-left:5px;font-size:11px}
.filters .pill.on .n{background:#fff}
.filters select.inp{width:auto;padding:7px 10px;font-size:12.5px}
textarea.inp{font-family:inherit;min-height:96px;resize:vertical;line-height:1.45}
.cred{background:var(--ink);color:#fff;border-radius:14px;padding:16px;margin-top:12px}
.cred .l{font-size:11.5px;color:#a9b8b1;font-weight:600}
.cred .v{font-size:17px;font-weight:800;letter-spacing:.02em;margin:2px 0 10px;word-break:break-all}
.cred .pwd{font-family:ui-monospace,Menlo,monospace;font-size:22px;color:var(--gold)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fgrid .full{grid-column:1/-1}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #f0f2f1;font-size:13px}
.kv:last-child{border:0}.kv span{color:var(--ink-3)}.kv b{text-align:right}
.perm-t td,.perm-t th{text-align:center}.perm-t td:first-child,.perm-t th:first-child{text-align:left}
.menu-link{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line);font-weight:600;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.count-line{font-size:12.5px;color:var(--ink-2);margin:-4px 0 10px}
.big-hero{padding:20px 20px 18px;border-radius:24px}
.hero-name{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.big-hero .big{font-size:30px;margin:4px 0 12px}
.hero-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.hero-pills span{background:rgba(255,255,255,.13);border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:700}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:linear-gradient(150deg,#e8f7f3 0%,#d6efe8 100%);border:1px solid #c4e5dc;border-radius:20px;padding:11px 12px;cursor:pointer;color:#0d5547;transition:transform .15s;min-width:0}
.mini:hover{transform:translateY(-2px)}
.mini-n{font-weight:800;font-size:12.5px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-width:0}
.mini-r{display:flex;justify-content:space-between;font-size:11px;margin-top:6px;color:#3d6b61}
.mini-r.big{margin-top:2px;font-size:12px;color:#0d5547}.mini-r.big b{font-size:14px}
.mini-f{font-size:10.5px;margin-top:7px;padding-top:6px;border-top:1px dashed #b3dbd0;color:#3d6b61}
.web .minis{max-width:720px}
.stage{gap:34px 28px}
.bellbtn{position:relative;border:0;background:#f0f4f2;border-radius:50%;width:36px;height:36px;display:grid;place-items:center;color:var(--ink);flex:none}
.badge{position:absolute;top:-3px;right:-3px;background:var(--red);color:#fff;border-radius:99px;font-size:10px;font-weight:800;min-width:18px;height:18px;padding:0 4px;display:grid;place-items:center;border:2px solid #fff}
.side .badge{border:0}
.seg2{display:flex;background:#e9eeeb;border-radius:12px;padding:3px;gap:2px}
.seg2 button{flex:1;border:0;background:none;padding:8px 6px;border-radius:9px;font-weight:700;font-size:12.5px;color:var(--ink-2)}
.seg2 button.on{background:#fff;color:var(--green);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.full-mobile .m-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;box-shadow:0 -6px 20px -12px rgba(0,0,0,.25)}
.full-mobile .m-body{padding-bottom:96px}
.full-mobile .m-head{position:sticky;top:0;z-index:20}
.chans{display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}
.ch-wa{background:#1fa855}.ch-wa:hover{background:#178a45}
.ch-sms{background:#2f6fd6}.ch-sms:hover{background:#2459b0}
.ch-app{background:var(--ink)}.ch-app:hover{background:#2b3833}
.bd-banner{display:flex;gap:12px;align-items:center;background:linear-gradient(120deg,#fdf1d6,#fbe3ad);border:1px solid #f0d28f;border-radius:16px;padding:11px 14px;cursor:pointer;color:#5e3f05}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--green-soft);border-top-color:var(--green);margin:0 auto;animation:sp 0.9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.op-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.op-tile{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px;font-weight:700;font-size:13px;text-align:left}
.op-tile.on{border-color:var(--gold);background:var(--gold-soft);box-shadow:0 0 0 3px #f6e2b5}
.mo-m{display:block;font-size:9.5px;font-weight:600;opacity:.75;margin-top:1px}
.mo small{display:block;font-size:9.5px;font-weight:600;opacity:.8}
.mo-help{font-size:11.5px;color:var(--ink-3);margin-top:10px;line-height:1.4}

/* splash */
.splash{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(120% 80% at 50% 38%,#1f7a4c 0%,#17603f 45%,#0f4a30 100%);color:#fff;transition:opacity .5s ease,transform .5s ease}
.splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.sp-glow{position:absolute;width:260px;height:260px;border-radius:50%;top:calc(50% - 175px);background:radial-gradient(circle,rgba(255,255,255,.16),transparent 65%);animation:spGlow 2.4s ease-in-out .9s infinite}
.sp-logo{position:relative;animation:spTurn 1s cubic-bezier(.65,0,.35,1) 1s both, spBreath 2.4s ease-in-out 2.1s infinite}
.sp-fig{transform-box:view-box;transform-origin:60px 60px;transform:rotate(var(--r));opacity:0;animation:spFig .7s cubic-bezier(.2,.9,.25,1.25) both}
.sp-core{transform-box:view-box;transform-origin:60px 60px;transform:scale(0);animation:spCore .5s cubic-bezier(.3,1.6,.5,1) .85s both}
.sp-name{margin-top:22px;font-size:38px;font-weight:800;letter-spacing:-.01em;display:flex}
.sp-name span{display:inline-block;opacity:0;transform:translateY(14px);animation:spUp .5s cubic-bezier(.2,.9,.3,1.2) both}
.sp-tag{margin-top:4px;font-size:13px;font-weight:600;color:#cfe6da;opacity:0;animation:spFade .6s ease 1.8s both;letter-spacing:.04em}
.sp-bar{position:absolute;bottom:70px;width:120px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;animation:spLoad 2.6s ease-in-out .4s forwards}
@keyframes spFig{from{opacity:0;transform:rotate(var(--r)) translateY(-26px) scale(.5)}to{opacity:1;transform:rotate(var(--r)) translateY(0) scale(1)}}
@keyframes spCore{to{transform:scale(1)}}
@keyframes spTurn{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes spBreath{0%,100%{scale:1}50%{scale:1.06}}
@keyframes spUp{to{opacity:1;transform:none}}
@keyframes spFade{to{opacity:1}}
@keyframes spGlow{0%,100%{opacity:.5;transform:scale(.9)}50%{opacity:1;transform:scale(1.08)}}
@keyframes spLoad{to{width:100%}}

/* ---- Affiches & événements ---- */
.caro{position:relative;border-radius:18px;overflow:hidden;background:#0b3a25}
.caro-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.caro-track::-webkit-scrollbar{display:none}
.caro-item{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:16/9;cursor:pointer}
.caro-item img{width:100%;height:100%;object-fit:cover;display:block}
.caro-dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.caro-dots i{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.5);transition:.25s}
.caro-dots i.on{width:18px;background:#fff}
.caro-empty{width:100%;border:1.5px dashed #b9cdc2;background:var(--green-soft);color:var(--green);border-radius:16px;padding:18px;font-weight:700;display:flex;gap:8px;justify-content:center;align-items:center;font-size:13px;cursor:pointer}
.dbadge{width:44px;flex:none;border-radius:12px;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);text-align:center;padding:5px 0 4px;line-height:1}
.dbadge b{display:block;font-size:18px;font-weight:800}.dbadge span{font-size:10.5px;font-weight:700;text-transform:uppercase}
.evt-img{border-radius:18px;overflow:hidden;aspect-ratio:12/5}.evt-img img{width:100%;height:100%;object-fit:cover;display:block}
.evt-ban{height:96px;border-radius:18px;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 55%,#000));display:grid;place-items:center;color:#fff}
.evt-ban .i{width:38px;height:38px;opacity:.9}
.rep3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rep3 button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;font-weight:700;font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink-2);cursor:pointer}
.rep3 button.on.oui{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.rep3 button.on.peut_etre{border-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
.rep3 button.on.non{border-color:#9aa6a0;background:#eef1ef;color:var(--ink)}
.sect-t{display:flex;gap:6px;align-items:center;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin:18px 2px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.chk{width:26px;height:26px;flex:none;border-radius:8px;border:1.5px solid #c5d0ca;background:#fff;display:grid;place-items:center;color:transparent;cursor:pointer}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.task-add{display:grid;grid-template-columns:1fr;gap:6px;margin-top:10px}
.web .task-add{grid-template-columns:1.4fr 1fr auto}
.img-drop{display:grid;place-items:center;border:1.5px dashed #b9cdc2;border-radius:14px;background:#f7faf8;min-height:120px;cursor:pointer;overflow:hidden;color:var(--green);font-weight:700}
.img-drop span{display:flex;gap:8px;align-items:center}.img-drop img{width:100%;aspect-ratio:12/5;object-fit:cover;display:block}
.aff-thumb{border-radius:12px;overflow:hidden;aspect-ratio:12/5;background:#eef1ef}.aff-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.aff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.aff-grid .aff-card{margin:0}
.btn:disabled{opacity:.4;pointer-events:none}
.web .evt-img,.web .evt-ban{max-width:640px}
.bans{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-left:-2px;padding:2px}
.bans::-webkit-scrollbar{display:none}
.ban{flex:0 0 84%;scroll-snap-align:start;aspect-ratio:12/5;border-radius:16px;overflow:hidden;cursor:pointer;background:#e6f2ec;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.bans.one .ban{flex-basis:100%}
.web .ban{flex-basis:calc(50% - 5px)}
.ban img{width:100%;height:100%;object-fit:cover;display:block}
.dim-hint{display:flex;gap:8px;align-items:flex-start;background:#f2f6f4;border-radius:10px;padding:8px 10px;font-size:12px;color:var(--ink-2);margin-bottom:8px;line-height:1.45}
.dim-hint .i{color:var(--green);margin-top:2px;flex:none}


/* ---- Ergonomie : un téléphone à la fois, pleine largeur sur mobile ---- */
.full-mobile .pane-wrap,.full-mobile .pane-wrap>div{width:100%;min-width:0}
.m-body,.screen,.m-head>div{min-width:0}
.phone .screen{overflow-x:hidden}
.full-mobile .who-bar{display:none}
.who-bar{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:14px 16px 0}
.who-bar button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--ink-2);cursor:pointer}
.who-bar button.on{background:var(--green);border-color:var(--green);color:#fff}
.stage.single .pane-wrap{display:none}.stage.single .pane-wrap.on{display:flex}
@media (max-height:900px){.stage.single .phone{transform:scale(.9);transform-origin:top center;margin-bottom:-80px}}

.evt3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.evt-mini{background:linear-gradient(160deg,#eef8f3,#e1f1e8);border:1px solid #cfe6da;border-radius:18px;padding:10px 10px 11px;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:3px}
.evt-mini.first{background:linear-gradient(150deg,var(--green),#0f4a30);border-color:transparent;color:#fff}
.evt-mini .dbadge{width:38px;padding:4px 0 3px}.evt-mini .dbadge b{font-size:15px}.evt-mini .dbadge span{font-size:9.5px}
.evt-mini.first .dbadge{background:rgba(255,255,255,.16);color:#fff}
.em-j{font-size:10.5px;font-weight:800;background:var(--gold);color:var(--ink);border-radius:99px;padding:2px 7px;white-space:nowrap}
.em-t{font-weight:800;font-size:12.5px;line-height:1.25;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:31px}
.em-h{font-size:10.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em-r{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;margin-top:3px}.em-r span{opacity:.6;font-weight:600}
.evt-mini .bar{background:rgba(0,0,0,.08)}.evt-mini.first .bar{background:rgba(255,255,255,.2)}.evt-mini.first .bar>i{background:var(--gold)}
.web .evt-mini{padding:14px}.web .em-t{font-size:14px}

.evc{flex:0 0 84%;scroll-snap-align:start;border-radius:18px;overflow:hidden;background:#fff;border:1px solid var(--line);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.web .evc{flex-basis:calc(33.33% - 7px)}
.evc-img{position:relative;aspect-ratio:12/5;background:#e6f2ec}.evc-img img{width:100%;height:100%;object-fit:cover;display:block}
.evc-j{position:absolute;top:8px;right:8px;background:var(--gold);color:var(--ink);font-weight:800;font-size:11.5px;border-radius:99px;padding:3px 9px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.evc-f{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;font-size:12px;color:var(--ink-2)}
.evc-f span{display:flex;align-items:center;gap:5px;white-space:nowrap}.evc-f b{color:var(--ink)}.evc-f .i{color:var(--green)}
.evc-f .warn .i{color:var(--amber)}
.ec-gen{height:100%;background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 50%,#000));color:#fff;padding:12px 14px;display:flex;flex-direction:column;justify-content:center}
.ec-k{display:flex;gap:5px;align-items:center;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.ec-t{font-size:19px;font-weight:800;line-height:1.15;margin:4px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ec-d{font-size:11.5px;opacity:.85}

.pick-list{max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:4px}
.pick{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;min-width:0}
.pick:hover{background:#f4f7f5}.pick input{width:18px;height:18px;accent-color:var(--green);flex:none}

.logo-full{max-width:100%}.lf-tag{font-size:11px;font-weight:700;color:var(--ink-3);letter-spacing:.02em;margin-top:2px;padding-left:2px}

.rc-head{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--green);color:#fff;margin:-18px -18px 14px;padding:14px 18px;border-radius:12px 12px 0 0;border-bottom:3px solid var(--gold)}

.fg-opt{width:100%;display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;color:var(--ink)}
.fg-opt:hover{border-color:var(--green)}.fg-opt b{display:block;font-size:14px}.fg-opt small{color:var(--ink-3);font-size:12px}.fg-opt>span:nth-child(2){flex:1}
.fg-ic{width:40px;height:40px;border-radius:12px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none}.fg-ic.wa{background:#e7f8ee;color:#1fa855}
.code6{font-size:22px;letter-spacing:.5em;text-align:center;font-weight:800}
